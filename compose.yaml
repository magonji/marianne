# docker compose up -d   →   http://<este equipo>:1111
services:
  marianne:
    build: .
    image: marianne:latest
    container_name: marianne
    restart: unless-stopped
    ports:
      - "1111:1111"
    volumes:
      # Tu config.yaml (copia de config.example.yaml), solo lectura.
      - ./config.yaml:/config/config.yaml:ro
      # Lo que se cambia desde la página (las fechas, tecla F): créala antes con `mkdir data`.
      - ./data:/app/data
      # El / del servidor, solo lectura, para el panel del servidor (discos, nombre, sistema).
      - /:/host:ro
      # La carpeta de la música para el iPod (fuente `music` con `folder: /music`), solo lectura.
      # Pon su ruta en .env (MUSIC_FOLDER=/ruta/a/la/musica); el usuario 1000 tiene que poder leerla.
      - ${MUSIC_FOLDER:-./music}:/music:ro
    environment:
      # Zona horaria de las horas que se muestran.
      TZ: ${TZ:-Europe/London}
      # Los secretos que config.yaml pide con ${...}, leídos del fichero .env.
      HASS_TOKEN: ${HASS_TOKEN:-}
      OPENWEATHER_KEY: ${OPENWEATHER_KEY:-}
      # Los enlaces iCal de los calendarios (añade aquí los que uses en config.yaml).
      ICAL_PERSONAL: ${ICAL_PERSONAL:-}
      ICAL_VILLCAHITERS: ${ICAL_VILLCAHITERS:-}
      ICAL_UNI: ${ICAL_UNI:-}
      ICAL_UNI_CLOSED: ${ICAL_UNI_CLOSED:-}
