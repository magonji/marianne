<!doctype html>
<html lang="es" data-theme="amber">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Marianne</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Mrs+Saint+Delafield&display=swap">
  <link rel="stylesheet" href="/static/style.css">
  <!-- On the phone's home screen, as an app: icon, name and full screen. -->
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Marianne">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#0d0800">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
</head>
<body>
  <div id="boot" hidden><pre id="boot-log"></pre></div>

  <header id="top">
    <div id="banner" aria-label="Marianne"><canvas id="banner-art" aria-hidden="true"></canvas></div>
    <div id="pomodoro" hidden>
      <div id="pomodoro-label"></div>
      <div id="pomodoro-digits" class="digits segments"></div>
    </div>
    <div id="clock">
      <div id="clock-date"></div>
      <div id="clock-digits" class="digits segments"></div>
    </div>
  </header>

  <div id="alarm" hidden></div>
  <div id="notice" hidden></div>

  <main id="panels"></main>

  <footer id="status"></footer>

  <div id="popup" hidden></div>

  <script src="/static/app.js"></script>
</body>
</html>
