[project]
name = "marianne"
version = "0.1.0"
description = "Panel retro en el navegador (Home Assistant, OpenWeather, scraping web...)"
readme = "README.md"
authors = [
    { name = "Mario González-Jiménez", email = "mario@mariogonzalez.es" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "websockets>=17.2",
]

[project.scripts]
marianne = "marianne:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
